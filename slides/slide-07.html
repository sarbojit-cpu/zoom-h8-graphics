:root{
  --cream:#F3EEE1;
  --cream-text:#FBF7EF;
  --ink:#221D18;
  --accent:#C1502E;
  --accent-deep:#8F3A20;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{width:1080px;height:1080px;}
.canvas{
  width:1080px;height:1080px;position:relative;overflow:hidden;
  background:var(--cream);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.topband{position:absolute;top:0;left:0;width:1080px;height:177px;background:var(--cream);z-index:5;}
.content{position:absolute;top:177px;left:0;width:1080px;height:903px;background:var(--cream);overflow:hidden;}

.eyebrow{
  font-family:'Inter';font-weight:800;font-size:19px;letter-spacing:0.15em;
  text-transform:uppercase;color:var(--accent);margin:0 0 16px;
}
.headline{
  font-family:'Archivo';font-weight:800;color:var(--ink);
  line-height:1.04;letter-spacing:-0.015em;margin:0 0 20px;
}
.bodycopy{
  font-family:'Inter';font-weight:500;font-size:22px;line-height:1.5;
  color:rgba(34,29,24,0.74);margin:0 0 30px;
}
.chiprow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 30px;}
.chip{
  font-family:'Inter';font-weight:700;font-size:13px;letter-spacing:0.03em;
  color:var(--ink);border:1.5px solid rgba(34,29,24,0.28);border-radius:999px;
  padding:8px 15px 7px;white-space:nowrap;
}
.cta{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--accent);color:var(--cream-text);
  font-family:'Inter';font-weight:700;font-size:20px;
  padding:17px 30px;border-radius:999px;width:fit-content;
}
.cta .arrow{font-size:21px;line-height:1;transform:translateY(1px);}

.ghost{
  position:absolute;right:8px;bottom:-58px;
  font-family:'Archivo';font-weight:800;font-size:300px;line-height:1;
  letter-spacing:-0.03em;color:rgba(34,29,24,0.09);z-index:5;user-select:none;
  pointer-events:none;
}
.ghost.on-dark{color:rgba(251,247,239,0.20);}
.eyebrow.on-dark{color:var(--cream-text);}
.headline.on-dark{color:var(--cream-text);}
.bodycopy.on-dark{color:rgba(251,247,239,0.92);}

/* ---- float layout: single image, contained, no crop ---- */
.float-wrap{position:relative;width:100%;height:100%;padding:56px 60px 48px;display:flex;flex-direction:column;}
.float-text{max-width:760px;flex-shrink:0;}
.float-imgbox{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:0 12px;}
.float-imgbox img{max-width:100%;max-height:100%;object-fit:contain;
  filter:drop-shadow(0 30px 40px rgba(34,29,24,0.16));}
.float-foot{display:flex;align-items:flex-end;justify-content:space-between;position:relative;flex-shrink:0;}

/* ---- float-duo: two images side by side, contained, no crop ---- */
.float-imgbox.duo{gap:28px;}
.float-imgbox.duo img{max-width:48%;max-height:100%;object-fit:contain;flex:1;
  filter:drop-shadow(0 20px 30px rgba(34,29,24,0.14));}

/* ---- bleed layout: full-content photo with bottom scrim ---- */
.bleed{position:relative;width:100%;height:100%;}
.bleed img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.wash{position:absolute;inset:0;background:rgba(20,14,10,0.08);}
.scrim{position:absolute;left:0;right:0;bottom:0;top:0;
  background:linear-gradient(180deg, rgba(20,15,11,0) 38%, rgba(20,15,11,0.58) 66%, rgba(18,13,10,0.93) 100%);}
.bleed-text{position:absolute;left:60px;right:60px;bottom:52px;z-index:2;}

</style>
</head>
